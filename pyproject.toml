[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s2motion"
version = "0.2.0"
description = "Detection and velocity measurement of moving objects using Sentinel-2 inter-band parallax"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Alfred Gabriel" }
]
keywords = ["sentinel-2", "remote-sensing", "pushbroom", "parallax", "velocity", "earth-observation"]
dependencies = [
    "pystac-client>=0.8.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
s2motion = "s2motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "script.py", "bandas.py", "medir.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "network: tests that query remote STAC services (deselect with '-m \"not network\"')",
]
