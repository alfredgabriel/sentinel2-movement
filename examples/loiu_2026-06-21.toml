# Case study: High-altitude aircraft in cruising flight
# Date: 2026-06-21
# Visible contrail and apparent displacement from Red to Blue across ~320 m.
# Note: For an airborne object at high altitude, apparent inter-band displacement
# conflates true aircraft ground speed with stereoscopic parallax induced by satellite motion.

[scene]
date = "2026-06-21"
bbox = [-2.945, 43.285, -2.875, 43.325]
description = "High-altitude aircraft in cruising flight showing parallax and contrail"

[seeds]
# Measured from unscaled crop raster (10 m/pixel)
# Chronological order of ground imaging: red -> green -> blue
red = [212, 253]
green = [206, 239]
blue = [196, 224]

[detection]
median_kernel = 9
radius = 3
threshold_ratio = 0.5

[output]
figure = "docs/img/loiu_2026-06-21_measured.png"

[parallax]
# User-specified cruise flight altitude parameters for stereoscopic parallax correction
# Note: Flight altitude is a user parameter, not an independently measured observable.
altitude_m = 10500.0
altitude_min_m = 9000.0
altitude_max_m = 12000.0

[validation]
# Georeferenced WGS84 target coordinates (Red centroid)
target_lat = 43.302306
target_lon = -2.918740
sensing_time = "2026-06-21T11:09:40Z"
max_distance_m = 2000.0  # Cruising en-route aircraft (evaluated at capture instant)
time_window_s = 60.0  # Search / extraction window
max_time_offset_s = 20.0  # Acceptance limit: |Δt_CPA| <= 20 s (tile scan duration ~15-20 s)
terrain_elevation_m = 42.0  # Regional terrain elevation MSL (subtracted to obtain height AGL)
# Combined 2-sigma heading tolerance: apparent heading sigma (~1.8°) combined in quadrature
# with altitude interval sensitivity (9-12 km, Δψ ~ 4.9° -> sigma_alt ~ 2.45°):
# sigma_comb = sqrt(1.8^2 + 2.45^2) ≈ 3.04° -> 2-sigma ≈ 6.1°
heading_tolerance_deg = 6.1
heading_deg = 316.4
speed_kmh = 932.0
speed_min_kmh = 907.0
speed_max_kmh = 960.0
# Apparent parameters for parallax recalculation with true ADS-B altitude:
apparent_speed_mps = 319.81
apparent_heading_deg = 330.41
