# Case study: Aircraft on approach to Bilbao Airport (LEBB/BIO) runway 12 (hypothesis, without ADS-B)
# Date: 2026-08-12
# The aircraft is located ~1.09 km NW of threshold 12, aligned within ~10 m of the extended centerline with heading ~117.4°.
# Chronological order of motion: Red -> Green -> Blue

[scene]
date = "2026-08-12"
bbox = [-2.945, 43.285, -2.875, 43.325]
runway_heading = 116.7
description = "Aircraft on approach to Bilbao Airport (LEBB/BIO) runway 12 (hypothesis, without ADS-B)"

[seeds]
# Approximate (x, y) coordinates measured in unscaled crop raster (10 m/pixel)
# Chronological order of ground imaging: red (t=0.000s) -> green (t=0.478s) -> blue (t=1.005s)
red = [66, 158]
green = [70, 160]
blue = [74, 162]

[detection]
median_kernel = 9
radius = 3
threshold_ratio = 0.5

[output]
figure = "docs/img/loiu_2026-08-12_measured.png"

[weather]
# Historical meteorological fusion via Open-Meteo API
enabled = true
elevation_m = 42.0
latitude = 43.301
longitude = -2.911
