# Case study: Aircraft on approach to Bilbao Airport (LEBB/BIO) runway 12 (hypothesis, without ADS-B)
# Date: 2026-08-12
# The aircraft is located ~1.09 km NW of threshold 12, aligned within ~10 m of the extended centerline with heading ~117.4°.
# Chronological order of motion: Red -> Green -> Blue

[scene]
date = "2026-08-12"
bbox = [-2.945, 43.285, -2.875, 43.325]
runway_heading = 116.7
description = "Aircraft on approach to Bilbao Airport (LEBB/BIO) runway 12 (hypothesis, without ADS-B)"

[seeds]
# Approximate (x, y) coordinates measured in unscaled crop raster (10 m/pixel)
# Chronological order of ground imaging: red (t=0.000s) -> green (t=0.478s) -> blue (t=1.005s)
red = [66, 158]
green = [70, 160]
blue = [74, 162]

[detection]
median_kernel = 9
radius = 3
threshold_ratio = 0.5

[output]
figure = "docs/img/loiu_2026-08-12_measured.png"

[weather]
# Historical meteorological fusion via Open-Meteo API
enabled = true
elevation_m = 42.0
latitude = 43.301
longitude = -2.911

[validation]
# Georeferenced WGS84 target coordinates (Red centroid)
target_lat = 43.310770
target_lon = -2.936874
sensing_time = "2026-08-12T11:09:40Z"
max_distance_m = 1000.0  # Terminal area / final approach (evaluated at capture instant)
time_window_s = 60.0  # Search / extraction window
max_time_offset_s = 20.0  # Acceptance limit: |Δt_CPA| <= 20 s (tile scan duration ~15-20 s)
terrain_elevation_m = 42.0  # Bilbao Airport elevation MSL
heading_tolerance_deg = 14.0  # 2-sigma (~2 * 7.0 deg)
heading_deg = 117.4
speed_kmh = 295.0
speed_min_kmh = 254.0
speed_max_kmh = 338.0
